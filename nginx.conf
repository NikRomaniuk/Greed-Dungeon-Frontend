server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS: resolve the Back-End per request, so nginx
    # starts even if the Back-End Container is not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API calls to the back-end container
    # Same origin for the browser -> no CORS needed
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache build & bin files (1 year)
    location ~* \.(?:js|css|ico|woff2?|ttf|eot|svg|png|jpe?g|gif|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }
}
