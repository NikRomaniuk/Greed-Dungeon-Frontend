<div class="container" [attr.aria-busy]="isLoading()">
  <h2>Floors</h2>

  @if (isLoading())
  {
    <p role="status">Loading Floors...</p>
  }
  @else if (errorMessage())
  {
    <p class="error" role="alert">{{ errorMessage() }}</p>
  }
  @else
  {
    <ul class="floor-list">
      @for (floor of floors(); track floor.id)
      {
        <li>
          <strong>{{ floor.name }}</strong> - Depth <span>{{ floor.depth }}</span>
        </li>
      }
      @empty
      {
        <li>No Floors found</li>
      }
    </ul>
  }
</div>
